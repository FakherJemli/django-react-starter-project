name: PR Validation

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-title:
    name: Conventional Commit Title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Advisory: remove continue-on-error to enforce title convention
        continue-on-error: true

  pr-size:
    name: PR Size Label
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: codelytv/pr-size-labeler@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          xs_label: 'size/XS'
          xs_max_size: '10'
          s_label: 'size/S'
          s_max_size: '100'
          m_label: 'size/M'
          m_max_size: '500'
          l_label: 'size/L'
          l_max_size: '1000'
          xl_label: 'size/XL'
        continue-on-error: true

  summary:
    name: PR Check Summary
    if: always()
    needs: [pr-title, pr-size]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Write summary
        run: |
          echo '## PR Validation Results' >> $GITHUB_STEP_SUMMARY
          echo '| Check | Status |' >> $GITHUB_STEP_SUMMARY
          echo '|---|---|' >> $GITHUB_STEP_SUMMARY
          echo "| Conventional Commit Title | ${{ needs.pr-title.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| PR Size Label | ${{ needs.pr-size.result }} |" >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '_Generated by [DevOpsGen](https://devopsgen.io)_' >> $GITHUB_STEP_SUMMARY
