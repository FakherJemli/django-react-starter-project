services:
  # Django API service
  - type: web
    name: django-backend
    env: python
    buildCommand: cd backend && ./build.sh
    startCommand: cd backend && gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: django_db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: false

  # Frontend static site
  - type: web
    name: react-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /(.*)
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://django-backend.onrender.com  # Update this with your backend URL

databases:
  - name: django_db
    databaseName: django_db
    user: django_user